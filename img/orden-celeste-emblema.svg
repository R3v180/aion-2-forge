  </g>
  <!-- ala derecha -->
  <g fill="url(#alaOscura)" stroke="#cfe9ff" stroke-opacity=".35" stroke-width=".6" transform="translate(128 0) scale(-1 1)">
    <path d="M58 50 C46 34 28 22 4 22 C14 28 21 35 25 42 C15 41 8 44 2 49 C13 51 21 54 27 58 C18 60 12 65 8 72 C20 69 31 67 40 68 C35 73 32 79 32 86 C41 79 50 72 56 64 Z"/>
    <path d="M56 58 C47 52 38 49 26 48 C32 52 36 55 39 59 C34 60 30 62 27 66 C35 65 42 64 48 65 Z" fill="#cfe9ff" fill-opacity=".3" stroke="none"/>
  </g>

