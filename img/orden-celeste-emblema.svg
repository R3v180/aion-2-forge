  <path d="M64 28 L92 38 L92 68 C92 90 78 103 64 112 C50 103 36 90 36 68 L36 38 Z" fill="url(#oro)"/>
  <path d="M64 33.5 L87 42 L87 68 C87 87 76 98 64 105.5 C52 98 41 87 41 68 L41 42 Z" fill="url(#escudo)"/>

  <!-- sol / orden celeste -->
  <circle cx="64" cy="62" r="14" fill="none" stroke="url(#oro)" stroke-width="2.2"/>
  <circle cx="64" cy="62" r="7.5" fill="#5fd3e8"/>
  <circle cx="64" cy="62" r="3.2" fill="#fff6d8"/>
