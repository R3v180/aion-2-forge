<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Orden Celeste">
  <defs>
    <linearGradient id="alaLuz" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".45" stop-color="#f0cd85"/>
      <stop offset="1" stop-color="#5fd3e8"/>
    </linearGradient>
    <linearGradient id="alaOscura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset=".45" stop-color="#6eb6ff"/>
      <stop offset="1" stop-color="#1a3a7a"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset=".5" stop-color="#e0b864"/>
      <stop offset="1" stop-color="#9a6a24"/>
    </linearGradient>
    <linearGradient id="escudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2740"/>
      <stop offset="1" stop-color="#070c16"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#7ec8ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7ec8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="64" cy="62" r="60" fill="url(#halo)"/>

  <!-- ala izquierda -->
  <g fill="url(#alaLuz)" stroke="#fff6d8" stroke-opacity=".35" stroke-width=".6">
    <path d="M58 50 C46 34 28 22 4 22 C14 28 21 35 25 42 C15 41 8 44 2 49 C13 51 21 54 27 58 C18 60 12 65 8 72 C20 69 31 67 40 68 C35 73 32 79 32 86 C41 79 50 72 56 64 Z"/>
