<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa · Orden Celeste AION 2</title>
<meta name="description" content="Mapa interactivo Orden Celeste: recolección, mascotas, cubos ocultos y más en Verteron, Altgard, Eltnen, Morheim y Abismo.">
<link rel="icon" href="img/orden-celeste-emblema.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/marco.css?v=9"><link rel="stylesheet" href="css/app.css?v=55">
</head>
<body class="pagina-mapa">
<main class="mapa-shell">
  <aside class="mapa-panel" id="mapa-panel">
    <div class="mapa-panel-cab">
      <h1 data-t="mapa.titulo"></h1>
      <p class="suave" data-t="mapa.sub"></p>
      <p class="mapa-atajo suave"><span data-t="mapa.tip_ruby"></span></p>
      <label class="mapa-busca">
        <span class="visually-hidden" data-t="mapa.buscar"></span>
        <input type="search" id="mapa-q" data-t-ph="mapa.buscar_ph" autocomplete="off">
      </label>
      <label class="mapa-campo">
        <span data-t="mapa.zona"></span>
        <select id="mapa-zona"></select>
      </label>
      <div class="mapa-rapidos">
        <button type="button" data-rapido="all" data-t="mapa.todas"></button>
        <button type="button" data-rapido="none" data-t="mapa.ninguna"></button>
        <button type="button" class="on" data-rapido="default" data-t="mapa.defecto"></button>
      </div>
    </div>
    <div class="mapa-capas" id="mapa-capas"></div>
    <p class="mapa-nota suave" data-t="mapa.nota"></p>
  </aside>
  <section class="mapa-vista">
    <button type="button" class="mapa-toggle" id="mapa-toggle" aria-expanded="true" data-t="mapa.filtros"></button>
    <div id="mapa-leaflet"></div>
    <div class="mapa-estado" id="mapa-estado"></div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/i18n.js?v=38"></script>
<script src="js/app.js?v=20"></script>
<script src="js/mapa.js?v=6"></script>
</body>
</html>
