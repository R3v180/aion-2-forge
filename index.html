<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="9HwkU16VJZRi4-U26bBcN6CG6tanW_FNaK-GP4egUjI">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orden Celeste · Legión AION 2 Marchutan · Espía Builds EU</title>
<meta name="description" content="Legión Orden Celeste (asmodianos, Marchutan). Web de fans con Espía Builds, tops, mapa, timers y herramientas abiertas a toda Europa.">
<meta name="keywords" content="AION 2, Orden Celeste, legión Marchutan, asmodianos, Espía Builds, tops poder, mapa rubí, timers grieta, builds">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://orden-celeste-aion2.onrender.com/index.html">
<link rel="icon" href="img/orden-celeste-emblema.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/marco.css?v=13"><link rel="stylesheet" href="css/app.css?v=80">
</head>
<body>
<main>
  <section class="heroe" id="heroe-carrusel" aria-roledescription="carousel" aria-label="Orden Celeste"></section>

  <p class="inicio-patrocinio" data-t="inicio.patrocinio"></p>

  <!-- Hueco listo para banners futuros: rellenar #slot-banner-inicio y quitar hidden -->
  <aside class="slot-banner" id="slot-banner-inicio" hidden aria-label="Banner"></aside>

  <section class="inicio-espia" id="herramientas">
    <div class="inicio-espia-in">
      <span class="chip inicio-espia-chip" data-t="inicio.espia_chip"></span>
      <h2 data-t="inicio.espia_titulo"></h2>
      <p data-t="inicio.espia_txt"></p>
      <div class="inicio-espia-acciones">
        <a class="boton boton-espia" href="espia.html"><span class="boton-espia-ico" aria-hidden="true"></span><span data-t="inicio.espia_cta"></span></a>
        <a class="enlace" href="mis-builds.html" data-t="inicio.espia_comparar"></a>
        <a class="enlace" href="tops.html" data-t="inicio.espia_tops"></a>
      </div>
    </div>
  </section>

  <section class="inicio-explora" aria-labelledby="explora-titulo">
    <div class="cabecera-seccion">
      <div>
        <h2 id="explora-titulo" data-t="inicio.explora_titulo"></h2>
        <p class="suave inicio-explora-sub" data-t="inicio.explora_sub"></p>
      </div>
    </div>
    <div class="inicio-explora-grid">
      <a class="inicio-explora-card foco con-foto" href="espia.html" style="--foto:url('/img/oficial/oc-arquero.webp')"><b data-t="inicio.card.espia"></b><small data-t="inicio.card.espia_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="tops.html" style="--foto:url('/img/oficial/ss_05.webp')"><b data-t="inicio.card.tops"></b><small data-t="inicio.card.tops_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="timers.html" style="--foto:url('/img/oficial/ss_08.webp')"><b data-t="inicio.card.timers"></b><small data-t="inicio.card.timers_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="herramientas.html" style="--foto:url('/img/oficial/ss_09.webp')"><b data-t="inicio.card.herramientas"></b><small data-t="inicio.card.herramientas_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="mapa.html" style="--foto:url('/img/oficial/ss_01.webp')"><b data-t="inicio.card.mapa"></b><small data-t="inicio.card.mapa_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="guias.html" style="--foto:url('/img/oficial/library_hero.webp')"><b data-t="inicio.card.guias"></b><small data-t="inicio.card.guias_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="clases.html" style="--foto:url('/icons/clases/templar-arte.webp')"><b data-t="inicio.card.clases"></b><small data-t="inicio.card.clases_txt"></small></a>
      <a class="inicio-explora-card con-foto" href="foro.html" style="--foto:url('/img/oficial/nc_teaser_og.webp')"><b data-t="inicio.card.comunidad"></b><small data-t="inicio.card.comunidad_txt"></small></a>
    </div>
  </section>

  <div class="cabecera-seccion" id="clases"><h2 data-t="inicio.clases"></h2><a href="clases.html" data-t="inicio.ver_clases"></a></div>
  <div class="rejilla clases" id="lista-clases"></div>

  <section class="inicio-tops panel">
    <div class="cabecera-seccion" style="margin:0;border:0;padding:0"><h2 data-t="tops.titulo"></h2><a href="tops.html" data-t="inicio.tops"></a></div>
    <p class="suave" data-t="inicio.tops_sub"></p>
    <a class="boton oro" href="tops.html" data-t="tops.ver"></a>
  </section>

  <div class="cabecera-seccion"><h2 data-t="inicio.recientes"></h2><a href="builds.html" data-t="inicio.ver_todas"></a></div>
  <div class="rejilla" id="recientes"></div>

  <section class="inicio-noticias">
    <div class="cabecera-seccion"><h2 data-t="noticias.titulo"></h2><a href="noticias.html" data-t="noticias.ver_todas"></a></div>
    <div id="noticias-inicio"><div class="vacio-lista" data-t="comun.cargando"></div></div>
  </section>
</main>
<script src="js/i18n.js?v=63"></script>
<script src="js/app.js?v=30"></script>
<script src="js/hero-carrusel.js?v=5"></script>
<script src="js/vistas.js?v=9"></script><script src="data/indice.js?v=2"></script><script src="js/noticias.js?v=7"></script>
<script>
cabecera("inicio");
traducirPagina();
OC_HERO.pintar($("#heroe-carrusel"));
bloqueNoticiasInicio($("#noticias-inicio"));
api("GET", "/api/config").then(function (c) {
  var a = $("#cta-discord");
  if (a && c && c.discord && c.discord.invitacion) {
    a.href = c.discord.invitacion;
    a.hidden = false;
  }
}).catch(function () {});
api("GET", "/api/estadisticas").catch(function () { return {}; }).then(function (n) {
  var total = CLASES_INFO.reduce(function (s, c) { return s + (n[c.id] || 0); }, 0);
  var visitas = typeof n.visitas === "number" ? n.visitas : 0;
  var dh = $("#datos-heroe");
  if (dh) {
    dh.innerHTML = [[CLASES_INFO.length, "inicio.dato_clases"], [CLASES_INFO.length * 35, "inicio.dato_habilidades"],
      [total, "inicio.dato_builds"], [fmtNum(visitas), "inicio.dato_visitas"]].map(function (d) {
      return "<div><b>" + d[0] + "</b><span>" + esc(t(d[1])) + "</span></div>";
    }).join("");
  }
  $("#lista-clases").innerHTML = CLASES_INFO.map(function (c) {
    return '<a class="tarjeta-clase" href="clase.html?c=' + c.id + '"><img class="arte" src="icons/clases/' + c.id + '-arte.webp" alt="" loading="lazy">' +
      (n[c.id] ? '<span class="chip cuenta">' + n[c.id] + " " + (n[c.id] === 1 ? "build" : "builds") + "</span>" : "") +
      '<div class="info"><img class="emb" src="icons/clases/' + c.id + '.webp" alt=""><div><b>' + esc(tr(c)) + "</b><small>" + esc(tr(c.rol)) + "</small></div></div></a>";
  }).join("");
});
api("GET", "/api/builds").then(function (l) {
  $("#recientes").innerHTML = l.length ? l.slice(0, 9).map(tarjetaBuild).join("") : '<div class="vacio-lista">' + esc(t("builds.vacio")) + "</div>";
});
</script>
</body>
</html>
