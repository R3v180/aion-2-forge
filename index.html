<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orden Celeste · Espía Builds · Gremio AION 2</title>
<meta name="description" content="Espía Builds: mira la build real de cualquier jugador de AION 2 (EU). Casa del gremio Orden Celeste — builds, foro y tops comunitarios.">
<link rel="icon" href="img/orden-celeste-emblema.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/marco.css?v=9"><link rel="stylesheet" href="css/app.css?v=55">
</head>
<body>
<main>
  <section class="heroe">
    <div class="artes">
      <img src="icons/clases/chanter-arte.webp" alt=""><img src="icons/clases/sorcerer-arte.webp" alt=""><img src="icons/clases/templar-arte.webp" alt="">
    </div>
    <div class="contenido">
      <div class="marca-gremio">
        <img class="emblema-grande" src="img/orden-celeste-emblema.svg" alt="Orden Celeste">
        <div><span class="antetitulo" data-t="inicio.antetitulo"></span><div class="nombre-gremio">Orden <span>Celeste</span></div></div>
      </div>
      <h1 data-t="inicio.titulo"></h1>
      <p data-t="inicio.sub"></p>
      <div class="botones">
        <a class="boton boton-espia" href="espia.html"><span class="boton-espia-ico" aria-hidden="true"></span><span data-t="inicio.espia"></span></a>
        <a class="boton oro" href="nueva-build.html" data-t="inicio.crear"></a>
        <a class="boton" href="tops.html" data-t="inicio.tops"></a>
      </div>
      <div class="datos-heroe" id="datos-heroe"></div>
    </div>
  </section>

  <section class="inicio-espia">
    <div class="inicio-espia-in">
      <span class="chip inicio-espia-chip" data-t="inicio.espia_chip"></span>
      <h2 data-t="inicio.espia_titulo"></h2>
      <p data-t="inicio.espia_txt"></p>
      <div class="inicio-espia-acciones">
        <a class="boton boton-espia" href="espia.html"><span class="boton-espia-ico" aria-hidden="true"></span><span data-t="inicio.espia_cta"></span></a>
        <a class="enlace" href="tops.html" data-t="inicio.espia_tops"></a>
      </div>
    </div>
  </section>

  <div class="cabecera-seccion" id="clases"><h2 data-t="inicio.clases"></h2><a href="clases.html" data-t="inicio.ver_clases"></a></div>
  <div class="rejilla clases" id="lista-clases"></div>

  <section class="inicio-tops panel">
    <div class="cabecera-seccion" style="margin:0;border:0;padding:0"><h2 data-t="tops.titulo"></h2><a href="tops.html" data-t="inicio.tops"></a></div>
    <p class="suave" data-t="inicio.tops_sub"></p>
    <a class="boton oro" href="tops.html" data-t="tops.ver"></a>
  </section>

  <div class="cabecera-seccion"><h2 data-t="inicio.recientes"></h2><a href="builds.html" data-t="inicio.ver_todas"></a></div>
  <div class="rejilla" id="recientes"></div>

  <section class="inicio-noticias">
    <div class="cabecera-seccion"><h2 data-t="noticias.titulo"></h2><a href="noticias.html" data-t="noticias.ver_todas"></a></div>
    <div id="noticias-inicio"><div class="vacio-lista" data-t="comun.cargando"></div></div>
  </section>
</main>
<script src="js/i18n.js?v=38"></script>
<script src="js/app.js?v=20"></script>
<script src="js/vistas.js?v=1"></script><script src="data/indice.js?v=2"></script><script src="js/noticias.js?v=7"></script>
<script>
cabecera("inicio");
traducirPagina();
bloqueNoticiasInicio($("#noticias-inicio"));
api("GET", "/api/estadisticas").catch(function () { return {}; }).then(function (n) {
  var total = CLASES_INFO.reduce(function (s, c) { return s + (n[c.id] || 0); }, 0);
  $("#datos-heroe").innerHTML = [[CLASES_INFO.length, "inicio.dato_clases"], [CLASES_INFO.length * 35, "inicio.dato_habilidades"],
    [total, "inicio.dato_builds"], [(window.INDICE || []).length || 53, "inicio.dato_guias"]].map(function (d) {
    return "<div><b>" + d[0] + "</b><span>" + esc(t(d[1])) + "</span></div>";
  }).join("");
  $("#lista-clases").innerHTML = CLASES_INFO.map(function (c) {
    return '<a class="tarjeta-clase" href="clase.html?c=' + c.id + '"><img class="arte" src="icons/clases/' + c.id + '-arte.webp" alt="" loading="lazy">' +
      (n[c.id] ? '<span class="chip cuenta">' + n[c.id] + " " + (n[c.id] === 1 ? "build" : "builds") + "</span>" : "") +
      '<div class="info"><img class="emb" src="icons/clases/' + c.id + '.webp" alt=""><div><b>' + esc(tr(c)) + "</b><small>" + esc(tr(c.rol)) + "</small></div></div></a>";
  }).join("");
});
api("GET", "/api/builds").then(function (l) {
  $("#recientes").innerHTML = l.length ? l.slice(0, 9).map(tarjetaBuild).join("") : '<div class="vacio-lista">' + esc(t("builds.vacio")) + "</div>";
});
</script>
</body>
</html>
