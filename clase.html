<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="9HwkU16VJZRi4-U26bBcN6CG6tanW_FNaK-GP4egUjI">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clase AION 2 ? Orden Celeste</title>
<meta name="description" content="Habilidades, builds y referencia de clase en AION 2. Legi?n Orden Celeste.">
<meta name="keywords" content="AION 2 clase, builds clase">
<meta name="robots" content="index,follow">
<link rel="icon" href="img/orden-celeste-emblema.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/marco.css?v=12"><link rel="stylesheet" href="css/app.css?v=71">
</head>
<body>
<main id="main"></main>
<script src="js/i18n.js?v=56"></script>
<script src="js/app.js?v=30"></script>
<script src="js/vistas.js?v=5"></script>
<script>
(function () {
  var clase = param("c");
  var c = claseInfo(clase);
  if (!CLASES_INFO.some(function (x) { return x.id === clase; })) { location.href = "index.html"; return; }
  cabecera("clases");
  document.title = tr(c) + " ? Orden Celeste AION 2";
  var main = $("#main"), nivel = 10, CAT;

  main.innerHTML = '<section class="banner"><img class="arte" src="icons/clases/' + clase + '-arte.webp" alt="">' +
    '<img class="emb" src="icons/clases/' + clase + '.webp" alt=""><div class="txt"><h1>' + esc(tr(c)) + '</h1><div class="meta">' + esc(tr(c.rol)) + "</div></div>" +
    '<div class="botones"><a class="boton oro" href="nueva-build.html?clase=' + clase + '">' + esc(t("clase.crear")) + " " + esc(tr(c)) + "</a></div></section>" +
    '<div class="enlaces-ext"><a class="boton chico" href="referencia.html?c=' + clase + '">' + esc(t("clase.guia_ref")) + "</a>" +
    '<a class="boton chico" href="https://expcarry.com/aion-2-' + clase + '-guide" target="_blank" rel="noopener">' + esc(t("clase.guia_ext")) + " ?</a>" +
    '<a class="boton chico" href="https://questlog.gg/aion-2/' + IDIOMA + "/db/skills/" + (clase === "spiritmaster" ? "elementalist" : clase) + '" target="_blank" rel="noopener">questlog ?</a></div>' +
    '<div class="cabecera-seccion"><h2 data-t="clase.builds"></h2><a href="builds.html?clase=' + clase + '" data-t="inicio.ver_todas"></a></div><div class="rejilla" id="builds"></div>' +
    '<div class="cabecera-seccion"><h2 data-t="clase.habilidades"></h2></div>' +
    '<div class="deslizador"><span data-t="clase.nivel_vista"></span><input type="range" min="1" max="20" value="' + nivel + '" id="nivel"><b id="nivel-txt">' + nivel + "</b></div>" +
    '<div id="habilidades"></div>';
  traducirPagina();

  api("GET", "/api/builds?clase=" + clase).then(function (l) {
    $("#builds").innerHTML = l.length ? l.slice(0, 6).map(tarjetaBuild).join("") : '<div class="vacio-lista">' + esc(t("builds.vacio")) + "</div>";
  });

  function pintarHabs() {
    $("#habilidades").innerHTML = ["activa", "estigma", "pasiva"].map(function (tipo) {
      var l = CAT.habilidades.filter(function (h) { return h.tipo === tipo; });
      return '<section class="grupo-hab"><h2>' + esc(t("tipo." + tipo)) + " <small>" + l.length + '</small></h2><div class="lista-hab">' + l.map(function (h) {
        var esp = h.esp.length ? '<div class="esp-lista">' + h.esp.map(function (e) {
          return '<div class="esp' + ((e.nivel || 99) <= nivel ? " on" : " bloq") + '"><span class="lv">' + (e.nivel || "") + "</span><span>" + esc(tr(e.texto)) + "</span></div>";
        }).join("") + "</div>" : "";
        return '<div class="hab">' + iconoHab(h, ' data-tip="' + esc(tipHabilidad(h, nivel, [])) + '"') + '<div class="cuerpo"><div class="linea"><span class="nombre">' +
          esc(tr(h.nombre)) + "</span>" + (h.enfriamiento ? '<span class="nv">' + numFmt(h.enfriamiento) + " s</span>" : "") + '</div><div class="desc">' +
          descripcion(h, nivel) + "</div>" + esp + "</div></div>";
      }).join("") + "</div></section>";
    }).join("");
  }
  cargarCatalogo(clase).then(function (cat) { CAT = cat; pintarHabs(); });
  $("#nivel").addEventListener("input", function (e) {
    nivel = parseInt(e.target.value, 10);
    $("#nivel-txt").textContent = nivel;
    if (CAT) pintarHabs();
  });
})();
</script>
</body>
</html>
