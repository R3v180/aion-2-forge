<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="9HwkU16VJZRi4-U26bBcN6CG6tanW_FNaK-GP4egUjI">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Aion 2 Forge AION 2</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/aion-2-forge-emblema.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/pwa-icon-es-192.png">
<link rel="manifest" href="site-es.webmanifest">
<meta name="theme-color" content="#0b111b">
<meta name="application-name" content="Aion 2 Forge">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/marco.css?v=16"><link rel="stylesheet" href="css/app.css?v=89">
<meta property="og:image" content="https://aion-2-forge.onrender.com/img/og-aion-2-forge-es.jpg">
<meta property="og:image:width" content="1200">

<body>
<main>
  <div class="caja-auth panel">
    <div class="pestanas">
      <button class="on" data-modo="entrar" data-t="auth.entrar"></button>
      <button data-modo="registro" data-t="auth.registro"></button>
    </div>
    <form id="form" autocomplete="on">
      <label class="trampa" aria-hidden="true">Web <input id="web" name="web" tabindex="-1" autocomplete="off"></label>
      <label for="usuario" data-t="auth.usuario"></label>
      <input id="usuario" autocomplete="username" required maxlength="24">
      <div class="campo-ayuda" id="ayuda-usuario" hidden data-t="auth.ayuda_usuario"></div>
      <label for="clave" data-t="auth.clave"></label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <div id="zona-humano" class="auth-humano" hidden>
        <label for="humano" id="humano-label"></label>
        <input id="humano" inputmode="numeric" autocomplete="off" maxlength="3">
        <div class="campo-ayuda" data-t="auth.humano_ayuda"></div>
      </div>
      <div id="zona-captcha" class="auth-captcha" hidden></div>
      <label class="interruptor auth-legal" id="zona-legal" hidden>
        <input type="checkbox" id="acepto-legal">
        <span class="pista"></span>
        <span data-t="auth.acepto_legal"></span>
      </label>
      <p class="campo-ayuda auth-legal-links" id="links-legal" hidden>
        <a class="enlace" href="legal.html?s=privacidad" data-t="legal.nav_privacidad"></a>
        ? <a class="enlace" href="legal.html?s=aviso" data-t="legal.nav_aviso"></a>
      </p>
      <div class="error" id="error"></div>
      <button class="boton oro" style="width:100%;margin-top:6px" id="enviar" data-t="auth.entrar"></button>
    </form>
  </div>
</main>
<script src="js/i18n.js?v=77"></script>
<script src="js/app.js?v=36"></script>
<script>
var modo = "entrar";
var authReto = null;
var turnstileId = null;
function volver() {
  var v = param("volver") || "mis-builds.html";
  return /^\/[\w\-./?=&%]*$/.test(v) && v.indexOf("//") < 0 && v.indexOf("entrar.html") < 0 ? v : "mis-builds.html";
}
function cargarTurnstile(sitekey) {
  return new Promise(function (ok, mal) {
    if (window.turnstile) { ok(); return; }
    var s = document.createElement("script");
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.async = true;
    s.onload = function () { ok(); };
    s.onerror = mal;
    document.head.appendChild(s);
  }).then(function () {
    var caja = $("#zona-captcha");
    caja.hidden = false;
    caja.innerHTML = "";
    turnstileId = window.turnstile.render(caja, { sitekey: sitekey, theme: "dark" });
  });
}
function prepararAntiBot() {
  return api("GET", "/api/auth-reto").then(function (r) {
    authReto = r;
    $("#zona-humano").hidden = true;
    $("#zona-captcha").hidden = true;
    $("#humano").value = "";
    $("#humano").required = false;
    if (modo !== "registro") return;
    if (r.turnstile) {
      return cargarTurnstile(r.turnstile).catch(function () {
        $("#error").textContent = t("err.captcha");
      });
    }
    if (r.humano && r.humano.pregunta) {
      $("#zona-humano").hidden = false;
      $("#humano-label").textContent = t("auth.humano").replace("{q}", r.humano.pregunta);
      $("#humano").required = true;
    }
  });
}
cabecera("").then(function (u) { if (u) location.href = volver(); });
traducirPagina();
prepararAntiBot().catch(function () {});
document.querySelectorAll("[data-modo]").forEach(function (b) {
  b.addEventListener("click", function () {
    modo = b.dataset.modo;
    document.querySelectorAll("[data-modo]").forEach(function (x) { x.classList.toggle("on", x === b); });
    $("#enviar").textContent = t(modo === "entrar" ? "auth.entrar" : "auth.registro");
    $("#ayuda-usuario").hidden = modo === "entrar";
    $("#zona-legal").hidden = modo === "entrar";
    $("#links-legal").hidden = modo === "entrar";
    $("#acepto-legal").required = modo === "registro";
    $("#clave").autocomplete = modo === "entrar" ? "current-password" : "new-password";
    $("#error").textContent = "";
    if (turnstileId != null && window.turnstile) {
      try { window.turnstile.remove(turnstileId); } catch (e) {}
      turnstileId = null;
    }
    $("#zona-captcha").innerHTML = "";
    prepararAntiBot().catch(function () {});
  });
});
$("#form").addEventListener("submit", function (e) {
  e.preventDefault();
  $("#enviar").disabled = true;
  $("#error").textContent = "";
  var cuerpo = { usuario: $("#usuario").value, clave: $("#clave").value, web: $("#web").value };
  if (modo === "registro") {
    if (!$("#acepto-legal").checked) {
      $("#error").textContent = t("err.acepto_legal");
      $("#enviar").disabled = false;
      return;
    }
    cuerpo.acepto_legal = true;
    if (authReto && authReto.turnstile && window.turnstile && turnstileId != null) {
      cuerpo.captcha = window.turnstile.getResponse(turnstileId) || "";
    } else {
      cuerpo.humano = $("#humano").value;
    }
  }
  api("POST", modo === "entrar" ? "/api/entrar" : "/api/registro", cuerpo)
    .then(function () { location.href = volver(); })
    .catch(function (er) {
      $("#error").textContent = textoError(er);
      $("#enviar").disabled = false;
      if (modo === "registro") {
        if (turnstileId != null && window.turnstile) {
          try { window.turnstile.reset(turnstileId); } catch (x) {}
        }
        prepararAntiBot().catch(function () {});
      }
    });
});
</script>
</body>
</html>
