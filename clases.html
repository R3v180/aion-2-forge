<body>

    <span class="antetitulo" data-t="clases.antetitulo"></span>
    <h1 data-t="clases.titulo"></h1>

<script src="js/i18n.js?v=55"></script>
<script src="js/app.js?v=30"></script>
<script>
cabecera("clases");
traducirPagina();
document.title = t("clases.titulo") + " ? Orden Celeste AION 2";
api("GET", "/api/estadisticas").catch(function () { return {}; }).then(function (n) {
  $("#lista-clases").innerHTML = CLASES_INFO.map(function (c) {
    var builds = n[c.id] || 0;
    return '<a class="tarjeta-clase grande" href="clase.html?c=' + c.id + '">' +
      '<img class="arte" src="icons/clases/' + c.id + '-arte.webp" alt="" loading="lazy">' +
      (builds ? '<span class="chip cuenta">' + builds + " " + (builds === 1 ? "build" : "builds") + "</span>" : "") +
      '<div class="info"><img class="emb" src="icons/clases/' + c.id + '.webp" alt="">' +
      "<div><b>" + esc(tr(c)) + "</b><small>" + esc(tr(c.rol)) + "</small>" +
      '<em>' + esc(t("clases.ver")) + " ?</em></div></div></a>";
  }).join("");
});
</script>
