<script>
(function () {
  var g = param("g") || "";
  cabeceraLegado("guias");
  var main = document.getElementById("main");
  var guia = (window.INDICE || []).filter(function (x) { return x.slug === g; })[0];
  if (!guia) { main.innerHTML = "<p>" + esc(t("legado.no_existe")) + "</p>"; return; }
  cargarScript("data/guias/" + encodeURIComponent(g) + ".js?v=2", function () {
    var G = window.GUIA;
    document.title = G.titulo + " · Aion 2 Forge AION 2";
    var misma = (window.INDICE || []).filter(function (x) { return x.categoria === G.categoria && x.slug !== G.slug; });
    main.innerHTML = '<p class="sub"><a href="guias.html">' + esc(t("legado.volver_guias")) + "</a> ? " + esc(CATEGORIAS[G.categoria] || G.categoria) + "</p>" +
      '<div class="guia-portada"><img src="' + arteGuia(G) + '" alt=""></div>' +
      "<h1>" + md(G.titulo) + "</h1>" +
      '<div class="panel">' + md(G.resumen) + "</div>" + bloquesHTML(G.bloques) +
      (misma.length ? "<h2>Más de " + esc(CATEGORIAS[G.categoria] || "") + '</h2><div class="rejilla">' + misma.map(function (x) {
        return '<a class="guia-link" href="guia.html?g=' + encodeURIComponent(x.slug) + '">' + md(x.titulo) + "<small>" + md(x.resumen) + "</small></a>";
      }).join("") + "</div>" : "");
    // icono de las habilidades de clase que nombran las guías
    var ICONOS = { "Resurrecci?n de invocaci?n": "ICON_CL_SKILL_039", "Provocaci?n": "ICON_TE_SKILL_012" };
    var re = new RegExp("(" + Object.keys(ICONOS).join("|") + ")", "g"), lista = [], w = document.createTreeWalker(main, NodeFilter.SHOW_TEXT), n;
    while ((n = w.nextNode())) if (!n.parentElement.closest("h1, h2, .hab") && n.textContent.match(re)) lista.push(n);
    lista.forEach(function (n) {
      var span = document.createElement("span");
      span.innerHTML = esc(n.textContent).replace(re, function (x) {
        return '<span class="hab"><img src="icons/habilidades/' + ICONOS[x] + '.webp" alt="">' + x + "</span>";
      });
      n.replaceWith.apply(n, Array.prototype.slice.call(span.childNodes));
    });
  }, function () { main.innerHTML = "<p>" + esc(t("legado.no_existe")) + "</p>"; });
})();
</script>
