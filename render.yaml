services:
  # Principal (nuevo)
  - type: web
    name: aion-2-forge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/estadisticas
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENTORNO
        value: produccion
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
  # Legacy: mantener hasta confirmar el nuevo; no borrar aún
  - type: web
    name: orden-celeste-aion2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
