cabecera("faq");
traducirPagina();
function textoFaq(obj) {
  if (!obj) return "";
  return obj[IDIOMA] || obj.es || obj.en || "";
}
function pintarFaq(items) {
  document.title = t("faq.titulo_doc");
  $("#faq-lista").innerHTML = items.map(function (it) {
    return '<details class="faq-item" id="faq-' + esc(it.id) + '">' +
      "<summary>" + esc(textoFaq(it.q)) + "</summary>" +
      "<div class=\"faq-a\"><p>" + esc(textoFaq(it.a)) + "</p></div></details>";
  }).join("");
  try {
    seoSocial({
      titulo: t("faq.titulo_doc"),
      descripcion: t("faq.desc"),
      keywords: t("faq.keywords")
    });
  } catch (e) {}
}
fetch("data/faq.json").then(function (r) { return r.json(); }).then(function (d) {
  pintarFaq((d && d.items) || []);
}).catch(function () {
  $("#faq-lista").innerHTML = "<p class=\"suave\">" + esc(t("faq.error")) + "</p>";
});
</script>
