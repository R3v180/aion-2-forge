<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="9HwkU16VJZRi4-U26bBcN6CG6tanW_FNaK-GP4egUjI">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds AION 2 · Comunidad Orden Celeste</title>
<meta name="description" content="Builds públicas de AION 2 de la legión Orden Celeste: habilidades, estigmas y Daevanion por clase.">
<meta name="keywords" content="AION 2 builds, build PvE, Daevanion, estigmas, Orden Celeste">
<meta name="robots" content="index,follow">
<link rel="icon" href="img/orden-celeste-emblema.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/marco.css?v=12"><link rel="stylesheet" href="css/app.css?v=69">
</head>
<body>
<main>
  <h1 data-t="builds.titulo"></h1>
  <p class="suave" data-t="builds.subtitulo" style="margin-top:-6px;margin-bottom:14px;max-width:52rem"></p>
  <div class="filtros">
    <input id="q" type="search" data-t-ph="builds.buscar">
    <select id="f-clase"></select>
    <select id="f-modo"></select>
  </div>
  <div class="rejilla" id="lista"><div class="vacio-lista" data-t="comun.cargando"></div></div>
</main>
<script src="js/i18n.js?v=54"></script>
<script src="js/app.js?v=29"></script>
<script src="js/vistas.js?v=4"></script>
<script>
cabecera("builds");
traducirPagina();
var fc = $("#f-clase"), fm = $("#f-modo"), q = $("#q");
fc.innerHTML = '<option value="">' + esc(t("clase.todas")) + "</option>" + CLASES_INFO.map(function (c) {
  return '<option value="' + c.id + '">' + esc(tr(c)) + "</option>";
}).join("");
fm.innerHTML = opcionesModo("", true);
fc.value = param("clase") || "";
function bloqueVacioBuilds(msg) {
  var entrar = SIN_SESION_LOCAL ? enPrincipal("entrar.html") : "entrar.html";
  var mis = SIN_SESION_LOCAL ? enPrincipal("mis-builds.html") : "mis-builds.html";
  return '<div class="vacio-lista vacio-cta">' +
    "<p><b>" + esc(msg) + "</b></p>" +
    "<p>" + esc(t("builds.vacio_cta")) + "</p>" +
    '<div class="vacio-acciones">' +
      '<a class="boton oro" href="' + esc(entrar) + '">' + esc(t("builds.entrar")) + "</a>" +
      '<a class="boton" href="' + esc(mis) + '">' + esc(t("builds.mis")) + "</a>" +
    "</div></div>";
}
function cargar() {
  var p = new URLSearchParams();
  if (fc.value) p.set("clase", fc.value);
  if (fm.value) p.set("modo", fm.value);
  if (q.value.trim()) p.set("q", q.value.trim());
  $("#lista").innerHTML = '<div class="vacio-lista">' + esc(t("comun.cargando")) + "</div>";
  api("GET", "/api/builds?" + p).then(function (l) {
    $("#lista").innerHTML = l.length
      ? l.map(tarjetaBuild).join("")
      : bloqueVacioBuilds(t("builds.vacio"));
  }).catch(function () {
    $("#lista").innerHTML = bloqueVacioBuilds(t("builds.error_local"));
  });
}
var espera;
q.addEventListener("input", function () { clearTimeout(espera); espera = setTimeout(cargar, 250); });
fc.addEventListener("change", cargar);
fm.addEventListener("change", cargar);
cargar();
</script>
</body>
</html>
