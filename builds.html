<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="9HwkU16VJZRi4-U26bBcN6CG6tanW_FNaK-GP4egUjI">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds AION 2 � Comunidad Orden Celeste</title>
<meta name="description" content="Builds p�blicas de AION 2 de la legi�n Orden Celeste: tops semanales y builds de la comunidad.">
<meta name="keywords" content="AION 2 builds, build PvE, Daevanion, estigmas, Orden Celeste">
<meta name="robots" content="index,follow">
<link rel="icon" href="img/orden-celeste-emblema.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/marco.css?v=13"><link rel="stylesheet" href="css/app.css?v=79">
</head>
<body>
<main class="builds-pagina">
  <h1 data-t="builds.titulo"></h1>
  <p class="suave builds-sub" data-t="builds.subtitulo"></p>

  <section class="builds-bloque" id="bloque-tops" hidden>
    <header class="builds-bloque-cab">
      <h2 data-t="builds.sec_tops"></h2>
      <p class="suave" data-t="builds.sec_tops_sub"></p>
    </header>
    <div id="tops-por-clase"></div>
  </section>

  <section class="builds-bloque" id="bloque-comunidad">
    <header class="builds-bloque-cab">
      <h2 data-t="builds.sec_comunidad"></h2>
      <p class="suave" data-t="builds.sec_comunidad_sub"></p>
    </header>
    <div class="filtros">
      <input id="q" type="search" data-t-ph="builds.buscar">
      <select id="f-clase"></select>
      <select id="f-modo"></select>
    </div>
    <div class="rejilla" id="lista"><div class="vacio-lista" data-t="comun.cargando"></div></div>
  </section>

  <details class="builds-archivo" id="bloque-archivo" hidden>
    <summary data-t="builds.sec_archivo"></summary>
    <p class="suave" data-t="builds.sec_archivo_sub"></p>
    <div class="rejilla rejilla-archivo" id="lista-archivo"></div>
  </details>
</main>
<script src="js/i18n.js?v=62"></script>
<script src="js/app.js?v=30"></script>
<script src="js/vistas.js?v=9"></script>
<script>
cabecera("builds");
traducirPagina();
var fc = $("#f-clase"), fm = $("#f-modo"), q = $("#q");
fc.innerHTML = '<option value="">' + esc(t("clase.todas")) + "</option>" + CLASES_INFO.map(function (c) {
  return '<option value="' + c.id + '">' + esc(tr(c)) + "</option>";
}).join("");
fm.innerHTML = opcionesModo("", true);
fc.value = param("clase") || "";

function bloqueVacioBuilds(msg) {
  var entrar = SIN_SESION_LOCAL ? enPrincipal("entrar.html") : "entrar.html";
  var mis = SIN_SESION_LOCAL ? enPrincipal("mis-builds.html") : "mis-builds.html";
  return '<div class="vacio-lista vacio-cta">' +
    "<p><b>" + esc(msg) + "</b></p>" +
    "<p>" + esc(t("builds.vacio_cta")) + "</p>" +
    '<div class="vacio-acciones">' +
      '<a class="boton oro" href="' + esc(entrar) + '">' + esc(t("builds.entrar")) + "</a>" +
      '<a class="boton" href="' + esc(mis) + '">' + esc(t("builds.mis")) + "</a>" +
    "</div></div>";
}

function pintarTops(live) {
  var caja = $("#tops-por-clase"), bloque = $("#bloque-tops");
  if (!live.length) { bloque.hidden = true; caja.innerHTML = ""; return; }
  bloque.hidden = false;
  var porClase = {};
  live.forEach(function (b) {
    if (!porClase[b.clase]) porClase[b.clase] = [];
    porClase[b.clase].push(b);
  });
  caja.innerHTML = CLASES_INFO.map(function (c) {
    var lista = porClase[c.id];
    if (!lista || !lista.length) return "";
    lista.sort(function (a, b) {
      return ((a.top && a.top.rank) || 99) - ((b.top && b.top.rank) || 99);
    });
    return '<div class="builds-clase">' +
      '<div class="builds-clase-cab"><img src="icons/clases/' + c.id + '.webp" alt="">' +
      "<h3>" + esc(tr(c)) + "</h3></div>" +
      '<div class="rejilla rejilla-tops">' + lista.map(tarjetaBuildTop).join("") + "</div></div>";
  }).join("");
}

function cargar() {
  var p = new URLSearchParams();
  if (fc.value) p.set("clase", fc.value);
  if (fm.value) p.set("modo", fm.value);
  if (q.value.trim()) p.set("q", q.value.trim());
  $("#lista").innerHTML = '<div class="vacio-lista">' + esc(t("comun.cargando")) + "</div>";
  var filtrando = !!(fc.value || fm.value || q.value.trim());
  api("GET", "/api/builds?" + p).then(function (l) {
    var live = [], archivo = [], comunidad = [];
    l.forEach(function (b) {
      var f = String(b.fuente || "");
      if (f.indexOf("top:live:") === 0) live.push(b);
      else if (f.indexOf("top:was:") === 0 || (f.indexOf("top:") === 0 && f.indexOf("top:live:") !== 0)) archivo.push(b);
      else comunidad.push(b);
    });
    // Con filtro JcE/JcJ o b�squeda: tops solo si vienen en la respuesta (modo excluye tops)
    if (filtrando && fm.value) {
      $("#bloque-tops").hidden = true;
      $("#tops-por-clase").innerHTML = "";
    } else {
      pintarTops(live);
    }
    $("#lista").innerHTML = comunidad.length
      ? comunidad.map(tarjetaBuild).join("")
      : bloqueVacioBuilds(t(filtrando ? "builds.vacio_filtro" : "builds.vacio"));
    var arch = $("#bloque-archivo"), listaA = $("#lista-archivo");
    if (!filtrando && archivo.length) {
      arch.hidden = false;
      listaA.innerHTML = archivo.map(tarjetaBuildTop).join("");
    } else {
      arch.hidden = true;
      listaA.innerHTML = "";
    }
  }).catch(function () {
    $("#bloque-tops").hidden = true;
    $("#bloque-archivo").hidden = true;
    $("#lista").innerHTML = bloqueVacioBuilds(t("builds.error_local"));
  });
}
var espera;
q.addEventListener("input", function () { clearTimeout(espera); espera = setTimeout(cargar, 250); });
fc.addEventListener("change", cargar);
fm.addEventListener("change", cargar);
cargar();
</script>
</body>
</html>
